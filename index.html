<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave - Panel de Orquestación WS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-indigo-400">Rave Orchestrator</h1>
            <p class="text-slate-400 text-sm mt-1">Gestión concurrente de sesiones WebSocket (Proxy Cloudflare)</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Formulario Agregar Cuenta -->
            <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">Añadir Nueva Sesión</h2>
                <div class="space-y-3">
                    <input type="text" id="newAlias" placeholder="Alias (Ej. Bot_01)" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
                    <input type="text" id="newToken" placeholder="Firebase JWT (eyJh...)" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
                    <button onclick="addAccount()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded transition-colors text-sm">
                        + Guardar Cuenta
                    </button>
                </div>
            </div>

            <!-- Control de Sala -->
            <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 col-span-1 md:col-span-2 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">Control Maestro de Sala</h2>
                <div class="flex flex-col space-y-4">
                    <input type="text" id="roomIdInput" placeholder="Room ID (Ej. 1c2af95d-64fd-4303-...)" class="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white focus:outline-none focus:border-emerald-500 text-sm font-mono">
                    
                    <div class="flex justify-between items-center pt-2">
                        <div class="space-x-2">
                            <button onclick="toggleSelectAll()" class="bg-slate-700 hover:bg-slate-600 text-sm px-3 py-1.5 rounded transition-colors">Seleccionar Todo</button>
                            <button onclick="disconnectSelected()" class="bg-yellow-900/50 hover:bg-yellow-800/80 text-yellow-200 text-sm px-3 py-1.5 rounded transition-colors border border-yellow-800">Desconectar</button>
                            <button onclick="deleteSelected()" class="bg-red-900/50 hover:bg-red-800/80 text-red-200 text-sm px-3 py-1.5 rounded transition-colors border border-red-800">Eliminar</button>
                        </div>
                        <button onclick="connectSelected()" id="connectBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-all">
                            ▶ Conectar Seleccionados
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de Cuentas -->
        <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-lg overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-900 border-b border-slate-700 text-sm text-slate-400">
                        <th class="p-3 w-12 text-center">#</th>
                        <th class="p-3">Alias</th>
                        <th class="p-3">JWT Token</th>
                        <th class="p-3 w-32 text-center">Estado</th>
                    </tr>
                </thead>
                <tbody id="accountsTableBody" class="text-sm divide-y divide-slate-700">
                    <!-- Las filas se inyectan aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // TU URL DE CLOUDFLARE WORKER AQUÍ
        const WORKER_URL = 'https://ravemulticuentas.system404g.workers.dev/api/join';

        let accounts = JSON.parse(localStorage.getItem('rave_accounts')) || [];
        let activeSockets = {}; // Mantiene los WebSockets vivos en memoria

        const tableBody = document.getElementById('accountsTableBody');
        const aliasInput = document.getElementById('newAlias');
        const tokenInput = document.getElementById('newToken');
        const roomInput = document.getElementById('roomIdInput');

        const statusConfig = {
            'Desconectado': 'bg-slate-600 text-slate-200',
            'Conectando...': 'bg-yellow-600 text-white animate-pulse',
            'Online': 'bg-emerald-500 text-white shadow-[0_0_10px_rgba(16,185,129,0.5)]',
            'Error': 'bg-red-500 text-white'
        };

        function renderTable() {
            tableBody.innerHTML = '';
            accounts.forEach(acc => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-750 transition-colors";
                const shortToken = acc.token.length > 20 ? acc.token.substring(0, 10) + '...' + acc.token.substring(acc.token.length - 10) : acc.token;
                
                // Si recargamos la página, todo empieza desconectado
                if (!acc.status) acc.status = 'Desconectado';

                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <input type="checkbox" class="acc-checkbox w-4 h-4 accent-indigo-500" data-id="${acc.id}">
                    </td>
                    <td class="p-3 font-medium text-slate-200">${acc.alias}</td>
                    <td class="p-3 font-mono text-slate-500 text-xs">${shortToken}</td>
                    <td class="p-3 text-center">
                        <span id="status-${acc.id}" class="px-2 py-1 rounded text-xs font-semibold ${statusConfig[acc.status]} transition-all">
                            ${acc.status}
                        </span>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            saveData();
        }

        function addAccount() {
            const alias = aliasInput.value.trim();
            const token = tokenInput.value.trim();
            if (!alias || !token) return alert("Ingresa Alias y Token.");
            
            accounts.push({ id: Date.now().toString(), alias, token, status: 'Desconectado' });
            aliasInput.value = '';
            tokenInput.value = '';
            renderTable();
        }

        function saveData() { localStorage.setItem('rave_accounts', JSON.stringify(accounts)); }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.acc-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        function deleteSelected() {
            const selectedIds = Array.from(document.querySelectorAll('.acc-checkbox:checked')).map(cb => cb.dataset.id);
            if(selectedIds.length === 0) return;
            if(confirm(`¿Eliminar ${selectedIds.length} cuenta(s)?`)) {
                selectedIds.forEach(id => {
                    if (activeSockets[id]) activeSockets[id].close(); // Cerrar conexión si existe
                });
                accounts = accounts.filter(acc => !selectedIds.includes(acc.id));
                renderTable();
            }
        }

        function updateStatus(id, newStatus) {
            const accIndex = accounts.findIndex(a => a.id === id);
            if (accIndex > -1) {
                accounts[accIndex].status = newStatus;
                const badge = document.getElementById(`status-${id}`);
                if (badge) {
                    badge.className = `px-2 py-1 rounded text-xs font-semibold ${statusConfig[newStatus]}`;
                    badge.innerText = newStatus;
                }
            }
        }

        function disconnectSelected() {
            const selectedIds = Array.from(document.querySelectorAll('.acc-checkbox:checked')).map(cb => cb.dataset.id);
            selectedIds.forEach(id => {
                if (activeSockets[id]) {
                    activeSockets[id].close();
                    delete activeSockets[id];
                }
                updateStatus(id, 'Desconectado');
            });
        }

        // --- NÚCLEO: Conexiones WebSocket hacia Cloudflare ---
        function connectSelected() {
            const roomId = roomInput.value.trim();
            if (!roomId) return alert("Ingresa el Room ID.");

            const selectedIds = Array.from(document.querySelectorAll('.acc-checkbox:checked')).map(cb => cb.dataset.id);
            if (selectedIds.length === 0) return alert("Selecciona al menos una cuenta.");

            // Convertir URL de HTTPS a WSS (WebSocket Secure)
            const wsDomain = WORKER_URL.replace("https://", "wss://").replace("http://", "ws://");

            selectedIds.forEach(id => {
                const acc = accounts.find(a => a.id === id);
                if(!acc) return;

                updateStatus(acc.id, 'Conectando...');

                // Si ya había una conexión viva para esta cuenta, la cerramos
                if (activeSockets[acc.id]) activeSockets[acc.id].close();

                // Pasamos el ID y el Token al Worker a través de la URL
                const proxyUrl = `${wsDomain}?roomId=${encodeURIComponent(roomId)}&token=${encodeURIComponent(acc.token)}`;
                
                try {
                    const ws = new WebSocket(proxyUrl);
                    activeSockets[acc.id] = ws;

                    ws.onopen = () => {
                        updateStatus(acc.id, 'Online');
                        console.log(`[${acc.alias}] Entró a la sala.`);
                    };

                    ws.onclose = () => {
                        updateStatus(acc.id, 'Desconectado');
                        console.log(`[${acc.alias}] Salió de la sala.`);
                        delete activeSockets[acc.id];
                    };

                    ws.onerror = (err) => {
                        updateStatus(acc.id, 'Error');
                        console.error(`[${acc.alias}] Error de red.`);
                    };
                } catch (error) {
                    updateStatus(acc.id, 'Error');
                }
            });
        }

        renderTable();
    </script>
</body>
</html>
